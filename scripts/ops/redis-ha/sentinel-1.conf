# Redis Sentinel config — node 1 of 3.
# Sentinel monitors the primary and performs automatic failover when it
# becomes unreachable. A majority (2 of 3) must agree for failover.

port 26379

sentinel monitor guardian-primary redis-1 6379 2
sentinel auth-pass guardian-primary redispass
sentinel down-after-milliseconds guardian-primary 5000
sentinel failover-timeout guardian-primary 10000
sentinel parallel-syncs guardian-primary 1
