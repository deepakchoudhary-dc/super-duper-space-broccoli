# PgBouncer — connection pooler in front of PostgreSQL.
#
# Run via docker (see scripts/ops/README.md):
#   docker run -d --name pgbouncer \
#     -p 6432:6432 \
#     -v $(pwd)/scripts/ops/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini \
#     -v $(pwd)/scripts/ops/pgbouncer-userlist.txt:/etc/pgbouncer/userlist.txt \
#     edoburu/pgbouncer
#
# Then point the gateway at it with:
#   DB_HOST=localhost DB_PORT=6432
# (the gateway's Pool already keeps connections warm, but PgBouncer absorbs
#  burst connection churn and protects Postgres from connection storms).

[databases]
api_guardian = host=postgres port=5432 dbname=api_guardian
api_guardian_test = host=postgres port=5432 dbname=api_guardian_test

[pgbouncer]
# Listen on all interfaces inside the container; expose 6432 to the host
listen_addr = 0.0.0.0
listen_port = 6432

# Connection pooling mode
#   session  - one server connection per client connection (safe for all apps)
#   transaction - one server connection per transaction (default, best for APIs)
#   statement - one server connection per statement (fastest, least safe)
pool_mode = transaction

# Per-database / per-user connection caps
default_pool_size = 20
max_client_conn = 1000
reserve_pool_size = 5
reserve_pool_timeout = 3

# Auth: plain scram-sha-256 entries in userlist.txt
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

# Health checks
server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 5
server_login_retry = 5

# Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
syslog = 0
verbose = 0

# Security
ignore_startup_parameters = extra_float_digits
admin_users = postgres
stats_users = postgres
