name: travel_companion
description: The ultimate all-in-one intelligent travel platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # UI & Charts
  fl_chart: ^0.70.2

  # Maps
  google_maps_flutter: ^2.9.0

  # Storage
  shared_preferences: ^2.5.3

  # HTTP & APIs
  http: ^1.3.0

  # Utilities
  intl: any
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
