version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: api_guardian_postgres
    environment:
      POSTGRES_DB: api_guardian
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - api_guardian_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: api_guardian_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - api_guardian_network

  # API Guardian Backend
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: api_guardian_backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: api_guardian
      DB_USER: postgres
      DB_PASSWORD: postgres_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: api-guardian-access-super-secret-key-32chars
      JWT_REFRESH_SECRET: api-guardian-refresh-super-secret-key-32chars
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_EXPIRES_IN: 30d
      SKIP_EMAIL_VERIFICATION: "true"
      FRONTEND_URL: http://localhost:3000
      API_GUARDIAN_DOMAIN: http://localhost:5000
    ports:
      - "5000:5000"
    volumes:
      - ./server/logs:/app/logs
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - api_guardian_network

  # API Guardian Frontend
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: api_guardian_frontend
    environment:
      REACT_APP_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - api_guardian_network

  # Nginx Reverse Proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: api_guardian_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - api_guardian_network
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:

networks:
  api_guardian_network:
    driver: bridge
