name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-server:
    name: Server tests (unit + integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: api_guardian_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:server -- --runInBand

      - name: Run integration tests (real Postgres + Redis)
        run: npm run test:server -- --runInBand --testPathPattern=integration
        env:
          NODE_ENV: test
          RUN_INTEGRATION: 'true'
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: api_guardian_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: test-access-secret-1234567890-abcdefghijklmnopqrstuvwxyz
          JWT_REFRESH_SECRET: test-refresh-secret-1234567890-abcdefghijklmnopqrstuvwxyz
          SKIP_EMAIL_VERIFICATION: 'true'
          WAF_ENABLED: 'false'

  test-client:
    name: Client tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Run client tests
        run: cd client && CI=true npm test -- --watchAll=false

      - name: Build production bundle
        run: cd client && CI=true npm run build
